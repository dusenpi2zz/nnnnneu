name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,plot]" -c environments/validated-constraints.txt
      - run: python -m pytest -q
      - run: neuro-methods demo --output runs/ci-demo
      - run: neuro-methods replay runs/ci-demo/roi-run/manifest.json --output runs/ci-replay
  lfpy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r environments/lfpy-linux.txt
      - run: python -m pip install . --no-deps
      - run: python -c "import LFPy, neuron; print(LFPy.__version__, neuron.__version__)"
      - run: python -m pytest tests/test_lfpy_optional.py -q
      - run: neuro-methods lfpy-demo --output runs/lfpy-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfpy-synthetic-validation
          path: runs/lfpy-ci/
